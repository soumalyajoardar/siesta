<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siesta Admin — Store Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141414'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='34' fill='%23FBFAF8' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- Login gate -->
  <div id="loginView" class="login-wrap" hidden>
    <form id="loginForm" class="login-card">
      <p class="logo">SIESTA<span class="logo-dot">.</span> <span class="admin-tag">ADMIN</span></p>
      <h1>Store dashboard</h1>
      <p class="muted">Manage products, images, orders and coupons.</p>
      <label>Username<input name="username" value="admin" autocomplete="username" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn btn-dark btn-block" type="submit">Log In</button>
      <p class="muted small">First run? The password is printed in the server console. Set <code>ADMIN_PASSWORD</code> to change it.</p>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dashView" class="dash" hidden>
    <aside class="side">
      <p class="logo">SIESTA<span class="logo-dot">.</span></p>
      <nav id="sideNav" aria-label="Admin sections">
        <button data-view="overview" class="active">Overview</button>
        <button data-view="products">Products</button>
        <button data-view="events">Events</button>
        <button data-view="homepage">Homepage</button>
        <button data-view="orders">Orders</button>
        <button data-view="coupons">Coupons</button>
        <button data-view="media">Media</button>
        <button data-view="settings">Settings</button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener">View store ↗</a>
        <button id="logoutBtn" class="link-btn">Log out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><h1 id="viewTitle">Overview</h1><span id="saveState" class="muted small"></span></header>
      <div id="view"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
